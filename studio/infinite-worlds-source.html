.room-hit{position:absolute;pointer-events:none}.aperture.room-branch{pointer-events:none}
.location{position:absolute;left:clamp(12px,2.7vw,38px);top:20px;display:flex;gap:7px;flex-direction:column;z-index:8;padding:9px 12px 10px;background:#141a1acb;backdrop-filter:blur(9px);border:1px solid #ffffff1f;border-radius:9px;pointer-events:none;box-shadow:0 4px 24px #00000018;max-width:80vw}
.location span{color:#efbf88;letter-spacing:.16em;font-size:9px;font-weight:800}.location strong{color:#fff2e5;font-size:13px;font-weight:640}
.floating-help{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#fff9efed;border:1px solid #2d29221d;border-radius:999px;color:#62574a;font-size:10px;letter-spacing:.1em;font-weight:750;white-space:nowrap;pointer-events:none;opacity:1;z-index:6}.floating-help span{color:#af6e42;margin-left:6px}
.toast{position:absolute;bottom:68px;left:50%;transform:translate(-50%,16px);background:#172123ec;color:#fce8cf;border:1px solid #caab8655;padding:10px 15px;max-width:min(92vw,390px);border-radius:10px;font-size:12px;z-index:8;text-align:center;opacity:0;pointer-events:none;transition:opacity .28s,transform .28s}.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{min-height:55px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,38px);gap:18px;background:#151a1b;border-top:1px solid #ffffff17;z-index:20}.footer span{font-size:9px;letter-spacing:.1em;color:#a79a8b;white-space:nowrap}.footer b{color:#d5aa77;font-weight:400;margin:0 5px}.footer .footnote{color:#a68767}.instruction-mobile{display:none}
.steps{display:flex;align-items:center;gap:7px}.steps button{border:0;background:#5e6060;border-radius:50%;width:6px;height:6px;padding:0;cursor:pointer;transition:background .2s,transform .2s}.steps button.active{background:#e3b17e;transform:scale(1.4)}.steps button.visited{background:#9e8468}
@media(max-width:850px){.brand-sub,.footnote{display:none!important}.instruction-desktop{display:none!important}.instruction-mobile{display:inline!important}.header{height:49px}.footer{min-height:49px}.brand{font-size:9px;gap:7px}.brand-mark{font-size:24px}.controls button{width:32px;height:32px}.controls{gap:4px}.location{top:12px}.location strong{font-size:11px}.footer span{font-size:8px}.floating-help{font-size:9px;bottom:17px}}
@media(max-width:420px){.brand{font-size:9px;letter-spacing:.055em}.header{padding-left:10px;padding-right:10px}.controls{gap:3px}.controls button{width:29px;height:30px}.controls svg{height:15px;width:15px}.footer{gap:5px;padding-left:10px;padding-right:10px}.footer span{letter-spacing:0;font-size:8px}.steps{gap:6px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}.controls button,.steps button{transition:none}}

/* Smooth travel polish: respect the logical world canvas throughout nesting. */
@media(max-width:600px){.header{height:51px;padding-inline:10px}.brand{gap:6px;font-size:9px}.brand-sub{display:none}.controls{gap:4px}.controls button{width:32px;height:32px}.controls svg{width:16px;height:16px}}
</style>

  if(p.x>=r.x-hitPadding&&p.x<=r.x+r.w+hitPadding&&p.y>=r.y-hitPadding&&p.y<=r.y+r.h+hitPadding)return key;
 }
 return null;
}
function tap(x,y){const hit=chosenBranch(x,y);if(hit){selectBranch(hit);return;}
 if(depth<3.75){nextWorld();return;}
 if(depth<4.18){show('Zoom op een van de monitoren, de klok, de MacBook of een ventilator.');return;}
 if(depth<5){nextWorld();return;}
 show('Je bent aan het voorlopige einde. Zoom uit om meer te ontdekken.');
}
viewport.addEventListener('wheel',e=>{
 e.preventDefault();const val=e.deltaY*(e.deltaMode===1?15:e.deltaMode===2?210:1)*.0015;
 const step=clamp(val,-.45,.45);
 if(step>0&&depth>=3.72&&depth<=4.8){const which=chosenBranch(e.clientX,e.clientY);if(which){branch=which;renderedStage=-1;}}
 setTarget(target+step);
},{passive:false});
viewport.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===1){moved=0;downAt={x:e.clientX,y:e.clientY};viewport.classList.add('dragging');}
 if(touches.size===2){const p=[...touches.values()];lastPinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
 viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;const was=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===1){const dx=e.clientX-was.x,dy=e.clientY-was.y;moved+=Math.abs(dx)+Math.abs(dy);targetPanX=clamp(targetPanX+dx,-vw*.9,vw*.9);targetPanY=clamp(targetPanY+dy,-vh*.9,vh*.9);}
 else if(touches.size===2){const p=[...touches.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  if(lastPinch>10&&dist>10){setTarget(target+clamp(Math.log(dist/lastPinch)*.75,-.32,.32));}lastPinch=dist;moved+=10;}
});
function release(e){if(!touches.has(e.pointerId))return;touches.delete(e.pointerId);if(touches.size<2)lastPinch=0;
 if(!touches.size){viewport.classList.remove('dragging');if(e.type==='pointerup'&&moved<12&&downAt)tap(downAt.x,downAt.y);downAt=null;}
}
viewport.addEventListener('pointerup',release);
viewport.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','+','-','Home',' '].includes(e.key)&&!e.repeat){e.preventDefault();
 if(e.key==='ArrowUp'||e.key==='+'||e.key===' ')nextWorld();
 else if(e.key==='ArrowDown'||e.key==='-')previousWorld();
 else {branch='film';targetPanX=targetPanY=0;setTarget(0);}}});
document.getElementById('zoomIn').onclick=nextWorld;
document.getElementById('zoomOut').onclick=previousWorld;
document.getElementById('reset').onclick=()=>{branch='film';targetPanX=targetPanY=0;setTarget(0);blip();};
soundBtn.onclick=()=>{soundEnabled=!soundEnabled;soundBtn.setAttribute('aria-pressed',String(soundEnabled));soundBtn.setAttribute('aria-label',soundEnabled?'Geluid uitzetten':'Geluid aanzetten');soundBtn.title=soundEnabled?'Geluid staat aan':'Geluid staat uit';if(soundEnabled)blip();};
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(_){show('Volledig scherm wordt hier niet ondersteund.');}};
for(let i=0;i<5;i++){const btn=document.createElement('button');btn.type='button';btn.title='Bekijk wereld '+i;btn.setAttribute('aria-label','Ga naar wereld '+i);btn.onclick=()=>{targetPanX=targetPanY=0;setTarget(i);blip();};dots.append(btn);}
window.addEventListener('resize',measure);if(window.ResizeObserver)new ResizeObserver(measure).observe(viewport);
measure();
// For screenshot QA only. Not part of normal UI; source remains easy to test and extend.
const params=new URLSearchParams(location.search);
if(params.has('stage')){depth=target=clamp(Number(params.get('stage'))||0,0,5);branch=branches[params.get('route')]?params.get('route'):'film';}
warmIntroduction().then(()=>{
  // Populate the root after all five source illustrations have decoded.
  // This makes the first visible draw and every following scene transition stable.
  frame();
}).catch(()=>frame());
})();
