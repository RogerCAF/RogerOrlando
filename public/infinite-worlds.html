<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9ddd8" />
  <title>The Bureau of Impossible Things — Wereld 1</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e9ddd8}
    body{background:radial-gradient(ellipse at 50% 40%,#f7efe9 0%,#e9ddd8 78%);font-family:Arial,sans-serif}
    #drawing{width:100%;height:100%;display:block;touch-action:none;cursor:zoom-in;outline:none;user-select:none;-webkit-user-select:none}
    #drawing:active{cursor:grabbing}#drawing:focus-visible{outline:2px solid #876e5c;outline-offset:-5px}
    #aria-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  </style>
</head>
<body>
  <canvas id="drawing" tabindex="0" role="img" aria-label="Wereld 1. Zoom met muiswiel of twee vingers in op het computerscherm en de gang; zoom weer uit om terug te gaan. Sleep om rond te kijken."></canvas>
  <div id="aria-status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('drawing');
      const ctx = canvas.getContext('2d', {alpha:false});
      const status = document.getElementById('aria-status');
      const illustration = new Image();
      illustration.src = '/bureau-world-one.webp';
      const pointers = new Map();
      const state = {zoom:1, target:1, panX:0, panY:0, dpr:1, width:0, height:0, lastPinch:0, frame:0, dirty:true};
      const MAX_ZOOM = 4.5; // stop at the small doorway; unfinished world 2 is deliberately not published
      const ease = matchMedia('(prefers-reduced-motion:reduce)').matches ? 1 : .22;
      const clamp = (v,lo,hi) => Math.min(hi,Math.max(lo,v));
      const viewport = () => {
        const b = canvas.getBoundingClientRect();
        state.width=b.width;state.height=b.height;
        state.dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.max(1,Math.round(b.width*state.dpr));
        canvas.height=Math.max(1,Math.round(b.height*state.dpr));
        state.dirty=true;
      };
      const zoomBy = factor => {
        state.target=clamp(state.target*factor,1,MAX_ZOOM);
        state.dirty=true;
        if(state.target>1.02)status.textContent='Je zoomt de gang binnen.';
      };
      const bounds = () => {
        if(!illustration.complete || !illustration.naturalWidth)return {x:0,y:0};
        const fit=Math.min(state.width/illustration.naturalWidth,state.height/illustration.naturalHeight);
        const visibleW=illustration.naturalWidth*fit*state.zoom;
        const visibleH=illustration.naturalHeight*fit*state.zoom;
        return {x:Math.max(0,(visibleW-state.width)/2),y:Math.max(0,(visibleH-state.height)/2)};
      };
      function draw() {
        state.frame=0;
        if(!state.width || !state.height)return;
        if(Math.abs(state.zoom-state.target)>0.0003){
          state.zoom+=(state.target-state.zoom)*ease;
          state.dirty=true;
        }else state.zoom=state.target;
        const bound=bounds();
        state.panX=clamp(state.panX,-bound.x,bound.x);
        state.panY=clamp(state.panY,-bound.y,bound.y);
        ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
        ctx.fillStyle='#e9ddd8';ctx.fillRect(0,0,state.width,state.height);
        if(illustration.complete && illustration.naturalWidth){
          const iw=illustration.naturalWidth,ih=illustration.naturalHeight;
          const fit=Math.min(state.width/iw,state.height/ih);
          const s=fit*state.zoom;
          // The original illustration remains uncut and exact: this is a camera move, not a scene swap.
          const focusMix=clamp((state.zoom-1)/2.5,0,1);
          const focusX=iw*.5,focusY=ih*(.5-.025*focusMix);
          const x=state.width/2-focusX*s+state.panX;
          const y=state.height/2-focusY*s+state.panY;
          ctx.imageSmoothingEnabled=true;
          ctx.imageSmoothingQuality='high';
          ctx.drawImage(illustration,x,y,iw*s,ih*s);
        }
        state.dirty=false;
        if(Math.abs(state.zoom-state.target)>0.0003)request();
      }
      const request = () => {if(!state.frame)state.frame=requestAnimationFrame(draw);};
      illustration.onload=()=>{viewport();request();};
      illustration.onerror=()=>{status.textContent='Illustratie kon niet worden geladen.';};
      const resize=new ResizeObserver(()=>{viewport();request();});resize.observe(canvas);
      canvas.addEventListener('wheel',e=>{
        e.preventDefault();
        const delta=e.deltaMode===1?e.deltaY*14:e.deltaMode===2?e.deltaY*400:e.deltaY;
        zoomBy(Math.exp(clamp(delta,-140,140)*.0014));request();
      },{passive:false});
      const pinchDistance=()=>{const a=[...pointers.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;};
      canvas.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse'&&e.button!==0)return;
        canvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        state.lastPinch=pinchDistance();
        if(e.pointerType==='mouse')canvas.style.cursor='grabbing';
      });
      canvas.addEventListener('pointermove',e=>{
        if(!pointers.has(e.pointerId))return;
        const old=pointers.get(e.pointerId);
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pointers.size===1){state.panX+=e.clientX-old.x;state.panY+=e.clientY-old.y;}
        else if(pointers.size===2){const next=pinchDistance();if(state.lastPinch>2&&next>2)zoomBy(next/state.lastPinch);state.lastPinch=next;}
        request();
      });
      const release=e=>{pointers.delete(e.pointerId);state.lastPinch=pinchDistance();canvas.style.cursor='zoom-in';};
      canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
      canvas.addEventListener('keydown',e=>{
        if(['+','=','ArrowDown'].includes(e.key)){zoomBy(1.19);e.preventDefault();request();}
        if(['-','ArrowUp'].includes(e.key)){zoomBy(1/1.19);e.preventDefault();request();}
        if(e.key==='Home'){state.target=1;state.panX=state.panY=0;e.preventDefault();request();}
      });
      viewport();request();
    })();
  </script>
</body>
</html>
