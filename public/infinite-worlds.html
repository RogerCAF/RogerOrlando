<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9ddd8" />
  <title>The Bureau of Impossible Things — Infinite Worlds</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9ddd8}
    body{font-family:Inter,Arial,sans-serif;background:radial-gradient(ellipse at 50% 39%,#f7eee7,#e6d9d0 87%)}
    .world{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:zoom-in;outline:none;user-select:none;-webkit-user-select:none}
    canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #af8b63;outline-offset:-4px}
    /* An unobtrusive, genuinely clickable gallery control — not an overlay on the monitor. */
    .start-dock{position:absolute;right:clamp(12px,2.6vw,36px);bottom:clamp(16px,3vw,34px);z-index:6}
    .start-dock[hidden]{display:none!important}
    .surprise{display:flex;align-items:center;gap:11px;min-height:58px;min-width:212px;
      padding:8px 14px 8px 9px;background:#f5ede4ee;color:#352821;
      border:1px solid #9b7a60aa;border-radius:12px;backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px #17110f2d,0 1px 0 #ffffff95 inset;
      cursor:pointer;text-align:left;font-family:inherit;transition:transform .16s,box-shadow .16s,background .16s}
    .surprise:hover{transform:translateY(-2px);background:#fff8ee;box-shadow:0 10px 32px #17110f42}
    .surprise:active{transform:translateY(0) scale(.98)}
    .surprise:focus-visible{outline:3px solid #b78548;outline-offset:3px}
    .surprise-icon{display:grid;place-items:center;flex:none;width:41px;height:41px;
      border-radius:10px;background:#33271f;color:#e8c78d}
    .surprise-icon svg{width:19px;height:19px}
    .dock-copy{display:flex;flex-direction:column;gap:3px;line-height:1.26}
    .dock-copy strong{font-size:13px;font-weight:700;letter-spacing:.02em}
    .dock-copy small{font-size:10px;color:#755e4e;white-space:nowrap}
    .start-dock[data-compact="true"] .surprise{min-width:0;width:47px;min-height:47px;padding:3px;border-radius:12px}
    .start-dock[data-compact="true"] .surprise-icon{width:39px;height:39px}
    .start-dock[data-compact="true"] .dock-copy{display:none}
    @media(max-width:630px){
      .start-dock{right:12px;bottom:max(16px,env(safe-area-inset-bottom))}
      .surprise{min-width:194px;min-height:54px;gap:9px;padding:6px 11px 6px 6px}
      .surprise-icon{width:40px;height:40px}
      .dock-copy strong{font-size:12px}.dock-copy small{font-size:9px}
    }
    .message{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(90%,480px);border:1px solid #cab39488;border-radius:5px;padding:9px 12px;background:#f9f4edeb;color:#4a4540;font-size:11px;line-height:1.35;letter-spacing:.03em;text-align:center;box-shadow:0 5px 26px #33221123;opacity:0;pointer-events:none;transition:opacity .25s}
    .message.show{opacity:1}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:630px){.message{font-size:10px;bottom:9px}}
  </style>
</head>
<body>
  <main class="world">
    <canvas id="drawing" tabindex="0" role="application" aria-label="The Bureau of Impossible Things. Scroll omhoog om in te zoomen, omlaag om uit te zoomen, of gebruik twee vingers. Sleep om rond te kijken. Zoom door het sleutelgat, de telescoop, het ronde serverraam, de vitrine en een kleine planeet. Random kiest alleen een einde."></canvas>
    <aside id="startDock" class="start-dock" aria-label="Kies een willekeurig einde">
      <button id="random" class="surprise" type="button" title="Kies een ander verborgen einde" aria-label="Kies een ander verborgen einde">
        <span class="surprise-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M4 7h3c4 0 6 10 10 10h3"/><path d="m17 14 3 3-3 3"/><path d="M4 17h3c1.8 0 3.1-2 4.3-4.2"/><path d="M14 8c.9-.7 1.8-1 3-1h3"/><path d="m17 4 3 3-3 3"/></svg></span>
        <span class="dock-copy"><strong>Verras me</strong><small>Een ander verborgen einde</small></span>
      </button>
    </aside>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div id="aria-status" class="sr" aria-live="polite"></div>
  </main>
  <script>
  (()=>{
    'use strict';
    const canvas=document.getElementById('drawing');
    const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
    const power=document.getElementById('random');
    const startDock=document.getElementById('startDock');
    const msg=document.getElementById('message');
    const aria=document.getElementById('aria-status');
    if(!ctx)return;
    const assets={};
    const sources={
      one:'/bureau-world-one.webp',
      hall:'/bureau-hallway-detail.webp',
      door:'/bureau-door-sharp.svg',
      two:'/bureau-world-two.webp',
      server:'/bureau-server-corridor.webp',
      archive:'/bureau-world-four-archive.webp',
      observatory:'/bureau-world-five-observatory.svg',
      puffer:'/bureau-ending-puffer.webp',
      shrimp:'/bureau-ending-shrimp.webp'
    };
    const st={log:0,target:0,panX:0,panY:0,width:0,height:0,dpr:1,frame:0,lastFrame:0,dirty:true,lastPinch:0,ending:0,toastTimer:0,pointers:new Map()};
    const MAX_LOG=19.5;
    const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
    const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
    const request=()=>{st.dirty=true;if(!st.frame)st.frame=requestAnimationFrame(render);};
    for(const [key,url] of Object.entries(sources)){
      const img=new Image();img.decoding='async';
      // Load the first world first, then decode the deeper scenes before they enter view.
      img.fetchPriority=key==='one'?'high':'low';
      img.onload=()=>{request();if(typeof img.decode==='function')img.decode().then(request,()=>{});};
      img.onerror=()=>{aria.textContent='Een illustratie kon niet worden geladen.';request();};
      img.src=url; assets[key]=img;
    }
    const ready=key=>assets[key]&&assets[key].complete&&assets[key].naturalWidth>0;
    const resize=()=>{
      const b=canvas.getBoundingClientRect();st.width=b.width;st.height=b.height;
      // Native 3x sharpness on Retina phones, subject to a 6 MP canvas budget.
      // On large desktops this budget scales down gracefully to protect FPS.
      st.dpr=Math.min(3,Math.max(1,window.devicePixelRatio||1),
        Math.sqrt(6000000/Math.max(1,st.width*st.height)));
      const w=Math.max(1,Math.round(st.width*st.dpr)),h=Math.max(1,Math.round(st.height*st.dpr));
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
      request();
    };
    const door={x:459,y:675,w:44,h:58};
    const lens={x:541,y:766,r:33.5};
    const serverExit={x:512,y:816,r:10.25};
    // An observatory is already visible inside the archive glass; a final world lives in its planet.
    const archivePortal={x:530,y:836,r:45};
    const skyPortal={x:543,y:765,r:34};
    // Exact registration: this small, ordinary escutcheon uses the SAME path in the SVG and canvas.
    // The glimpse beyond the door therefore has no independent position or rescaling.
    // Standard-size lock aperture just below the right brass pull, not in the panel.
    // Its source SVG and clip use the exact same contour.
    const aperture={x:495,y:789,w:25,h:41};
    const keyholePath=new Path2D('M507.5 789 C499 789 495 794 495 801 Q495 807 502 812 L499 826 Q507.5 830 516 826 L513 812 Q520 806 520 801 C520 793 516 789 507.5 789Z');
    function keyhole(){ctx.clip(keyholePath);}
    // Every artwork is replaced by one screen of exactly the same footprint.
    // All coordinates are expressed in the high-resolution hallway's 1680x2020
    // local reference, so they remain fixed in perspective at every zoom level.
    const wallPanels=[
      [[274,1398],[385,1453],[386,1708],[271,1711]],
      [[444,1484],[502,1515],[503,1701],[444,1701]],
      [[561,1535],[616,1553],[617,1697],[562,1698]],
      [[666,1578],[700,1594],[700,1695],[667,1697]],
      [[727,1602],[749,1618],[750,1693],[727,1695]]
    ];
    function paintScreens(geo){
      if(!ready('hall'))return;
      ctx.save();ctx.setTransform(st.dpr*geo.sx,0,0,st.dpr*geo.sy,st.dpr*geo.ox,st.dpr*geo.oy);
      const project=(p,u,v)=>[
        p[0][0]*(1-u)*(1-v)+p[1][0]*u*(1-v)+p[2][0]*u*v+p[3][0]*(1-u)*v,
        p[0][1]*(1-u)*(1-v)+p[1][1]*u*(1-v)+p[2][1]*u*v+p[3][1]*(1-u)*v];
      const segment=(p,points,color,width)=>{
        ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();
        points.forEach(([u,v],i)=>{const [x,y]=project(p,u,v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();};
      for(const left of wallPanels){
        for(let side=0;side<2;side++){
          const p=side?left.map(([x,y])=>[1680-x,y]):left;
          ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();
          ctx.fillStyle='#1a252b';ctx.fill();ctx.lineJoin='round';ctx.strokeStyle='#3e4e53';ctx.lineWidth=3;ctx.stroke();
          segment(p,[[.08,.06],[.92,.06]],'#445b63',1.4);
          segment(p,[[.12,.18],[.66,.18]],'#648694',1.6);
          segment(p,[[.12,.25],[.78,.25]],'#354b55',1.25);
          segment(p,[[.12,.36],[.61,.36]],'#354b55',1.25);
          segment(p,[[.12,.70],[.28,.61],[.49,.68],[.64,.43],[.86,.53]],'#77c2d1',2.1);
          segment(p,[[.13,.79],[.83,.79]],'#435f69',1.4);
          const [lx,ly]=project(p,.13,.10);ctx.fillStyle='#a4d0aa';ctx.beginPath();ctx.arc(lx,ly,2.2,0,Math.PI*2);ctx.fill();
        }
      }
      ctx.restore();
    }
    function paintKeyholeFrame(geo){
      const d=st.dpr;
      ctx.save();ctx.setTransform(d*geo.sx,0,0,d*geo.sy,d*geo.ox,d*geo.oy);
      ctx.lineJoin='round';ctx.lineWidth=6;ctx.strokeStyle='#322317';ctx.stroke(keyholePath);
      ctx.lineWidth=3.5;ctx.strokeStyle='#cda56b';ctx.stroke(keyholePath);
      ctx.restore();
    }
    const endKeys=['puffer','shrimp'];
    // Each world has one fixed affine registration with its parent. The single
    // round telescope aperture is inset INSIDE the painted brass rim, not over it.
    // At extreme zoom we paint only the visible image pixels, preventing the
    // enormous off-screen transforms that made the last world disappear on iOS.
    function imageRegion(key,geo){
      if(!ready(key)||geo.sx<=0||geo.sy<=0)return;
      const img=assets[key];
      const left=clamp((-geo.ox-2)/geo.sx,0,img.naturalWidth);
      const top=clamp((-geo.oy-2)/geo.sy,0,img.naturalHeight);
      const right=clamp((st.width-geo.ox+2)/geo.sx,0,img.naturalWidth);
      const bottom=clamp((st.height-geo.oy+2)/geo.sy,0,img.naturalHeight);
      if(right<=left||bottom<=top)return;
      ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
      ctx.drawImage(img,left,top,right-left,bottom-top,
        geo.ox+left*geo.sx,geo.oy+top*geo.sy,
        (right-left)*geo.sx,(bottom-top)*geo.sy);
    }
    function boxCoversView(g,w,h){
      return g.ox<=0&&g.oy<=0&&g.ox+w*g.sx>=st.width&&g.oy+h*g.sy>=st.height;
    }
    function clipRect(g,w,h){
      if(boxCoversView(g,w,h))return;
      ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
      ctx.beginPath();ctx.rect(g.ox,g.oy,w*g.sx,h*g.sy);ctx.clip();
    }
    function clipKeyhole(g){
      // At very deep zoom the camera and viewport are fully inside the tiny
      // top section of the keyhole. Skipping the huge off-screen clip is exact.
      // The optical axis now passes just under the right pull, near (507.5,809).
      // Skip the expensive enormous clipping path only when fully inside the aperture.
      const localLeft=(0-g.ox)/g.sx,localRight=(st.width-g.ox)/g.sx;
      const localTop=(0-g.oy)/g.sy,localBottom=(st.height-g.oy)/g.sy;
      if(localLeft>=505&&localRight<=510&&localTop>=807&&localBottom<=810)return;
      ctx.setTransform(st.dpr*g.sx,0,0,st.dpr*g.sy,st.dpr*g.ox,st.dpr*g.oy);
      ctx.clip(keyholePath);
    }
    function clipCircle(g,cx,cy,rad){
      const x=g.ox+g.sx*cx,y=g.oy+g.sy*cy;
      const rx=rad*g.sx,ry=rad*g.sy;
      const maxDX=Math.max(Math.abs(x),Math.abs(st.width-x))/rx;
      const maxDY=Math.max(Math.abs(y),Math.abs(st.height-y))/ry;
      if(maxDX*maxDX+maxDY*maxDY<.998)return;
      ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
      ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.clip();
    }
    function render(now){
      st.frame=0;
      const {width:vw,height:vh,dpr}=st;if(vw<=0||vh<=0)return;
      const delta=st.target-st.log;
      // Time-based camera easing: same zoom behavior on 60 Hz and 120 Hz screens.
      const dt=st.lastFrame?clamp(now-st.lastFrame,1,80):16.67;
      st.lastFrame=now;
      st.log+=delta*(reduced?1:1-Math.exp(-dt/105));
      if(Math.abs(delta)<.00015){st.log=st.target;st.lastFrame=0;}else request();
      const z=Math.exp(st.log);
      const fit=Math.min(vw/960,vh/1370);
      const telescopeDiameter=lens.r*2;
      const serverScale=telescopeDiameter/1024;
      // Exact cumulative coordinates; no image-to-image motion or scale jumps.
      const lensX=door.x+door.w/900*(aperture.x+aperture.w/1086*lens.x);
      const lensY=door.y+door.h/1200*(aperture.y+aperture.h/1448*lens.y);
      // Every focal point is computed from the same nested affine registrations.
      // At high zoom even a subpixel mistake in an earlier world becomes visible.
      const archiveScale=(serverExit.r*2)/1086;
      const observatoryScale=(archivePortal.r*2)/1086;
      const endingScale=(skyPortal.r*2)/1086;
      const serverExitX=lensX+(serverExit.x-512)*door.w/900*aperture.w/1086*serverScale;
      const serverExitY=lensY+(serverExit.y-768)*door.h/1200*aperture.h/1448*serverScale;
      const archiveFocusX=serverExitX+(archivePortal.x-543)*door.w/900*aperture.w/1086*serverScale*archiveScale;
      const archiveFocusY=serverExitY+(archivePortal.y-724)*door.h/1200*aperture.h/1448*serverScale*archiveScale;
      const skyFocusX=archiveFocusX+(skyPortal.x-543)*door.w/900*aperture.w/1086*serverScale*archiveScale*observatoryScale;
      const skyFocusY=archiveFocusY+(skyPortal.y-724)*door.h/1200*aperture.h/1448*serverScale*archiveScale*observatoryScale;
      const approach=smooth(st.log/3.7);
      const deep=smooth((st.log-6.4)/3.3);
      const further=smooth((st.log-10.1)/3.0);
      const celestial=smooth((st.log-13.3)/3.0);
      const focusX=480+(lensX-480)*approach+(serverExitX-lensX)*deep+
        (archiveFocusX-serverExitX)*further+(skyFocusX-archiveFocusX)*celestial;
      const focusY=685+(lensY-685)*approach+(serverExitY-lensY)*deep+
        (archiveFocusY-serverExitY)*further+(skyFocusY-archiveFocusY)*celestial;
      const base={ox:vw/2+st.panX-focusX*fit*z,
                  oy:vh/2+st.panY-focusY*fit*z,sx:fit*z,sy:fit*z};
      // High-resolution, feathered detail crop of the *same approved artwork*.
      // No new hall composition: every edge stays at the original coordinates.
      const hallGeo={ox:base.ox+270*base.sx,oy:base.oy+285*base.sy,
                     sx:base.sx*420/1680,sy:base.sy*505/2020};
      const doorGeo={ox:base.ox+door.x*base.sx,oy:base.oy+door.y*base.sy,
                     sx:base.sx*door.w/900,sy:base.sy*door.h/1200};
      // The replacement is genuinely scale-independent vector art (900×1200),
      // not an enlarged, blurry raster crop.
      const doorImgGeo=doorGeo;
      const twoGeo={ox:doorGeo.ox+aperture.x*doorGeo.sx,
                    oy:doorGeo.oy+aperture.y*doorGeo.sy,
                    sx:doorGeo.sx*aperture.w/1086,
                    sy:doorGeo.sy*aperture.h/1448};
      const serverGeo={ox:twoGeo.ox+(lens.x-512*serverScale)*twoGeo.sx,
                       oy:twoGeo.oy+(lens.y-768*serverScale)*twoGeo.sy,
                       sx:twoGeo.sx*serverScale,sy:twoGeo.sy*serverScale};
      // World 4 is already visible through the BLUE GLASS inside the server door.
      const archiveGeo={ox:serverGeo.ox+(serverExit.x-543*archiveScale)*serverGeo.sx,
                        oy:serverGeo.oy+(serverExit.y-724*archiveScale)*serverGeo.sy,
                        sx:serverGeo.sx*archiveScale,sy:serverGeo.sy*archiveScale};
      // World 5 lives in a small glass observatory within the underwater archive.
      const observatoryGeo={ox:archiveGeo.ox+(archivePortal.x-543*observatoryScale)*archiveGeo.sx,
                            oy:archiveGeo.oy+(archivePortal.y-724*observatoryScale)*archiveGeo.sy,
                            sx:archiveGeo.sx*observatoryScale,sy:archiveGeo.sy*observatoryScale};
      // A small planet in the observatory contains whichever ending Random selected.
      const endingGeo={ox:observatoryGeo.ox+(skyPortal.x-543*endingScale)*observatoryGeo.sx,
                       oy:observatoryGeo.oy+(skyPortal.y-721*endingScale)*observatoryGeo.sy,
                       sx:observatoryGeo.sx*endingScale,sy:observatoryGeo.sy*endingScale};
      startDock.hidden=!ready('one');
      startDock.dataset.compact=st.log>.55?'true':'false';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      // Favor smooth high-quality downsampling when the viewport is between worlds.
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      ctx.fillStyle='#e9ddd8';ctx.fillRect(0,0,vw,vh);
      if(!ready('one')){
        ctx.fillStyle='#574b44';ctx.font='13px Arial';ctx.textAlign='center';
        ctx.fillText('De wereld wordt geladen…',vw/2,vh/2);return;
      }
      // World 1: preserve approved artwork exactly until it fills the entrance.
      if(z<80){imageRegion('one',base);
        // A high-resolution inset for the long gallery softens no edges and
        // only appears on approach. The tapered alpha hides the crop boundary.
        const hallAlpha=smooth((st.log-.6)/1.25);
        if(ready('hall')&&hallAlpha>.001){
          ctx.save();ctx.globalAlpha=hallAlpha;
          imageRegion('hall',hallGeo);
          // The screens belong to this hallway detail and must fade in WITH it.
          // Keeping both in one opacity group preserves the approved start image.
          paintScreens(hallGeo);
          ctx.restore();
        }}
      // Detailed door blends into the original as its small painted door approaches.
      ctx.save();clipRect(base,960,1370);clipRect(doorGeo,900,1200);
      // Let the sharp illustrated door take over while it is still small,
      // avoiding a long double-image blend once handles and panels are visible.
      // Stay on the original high-resolution hall while it still has enough detail.
      // Blend the matching rectangular vector door in before the pixels enlarge.
      const detailAlpha=smooth((st.log-1.15)/1.10);
      if(ready('door')&&z<3500){ctx.globalAlpha=detailAlpha;imageRegion('door',doorImgGeo);}
      ctx.globalAlpha=1;
      if(detailAlpha>.02)paintKeyholeFrame(doorGeo);
      ctx.restore();
      // Each subsequent drawing is independently clipped to its physical
      // portal and uses a source crop, so deep zoom never overflows the GPU.
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      imageRegion('two',twoGeo);
      ctx.restore();
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      clipCircle(twoGeo,lens.x,lens.y,lens.r);
      imageRegion('server',serverGeo);
      ctx.restore();
      // Underwater archive: one miniature world, precisely inset in the glass at the far end.
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      clipCircle(twoGeo,lens.x,lens.y,lens.r);
      clipCircle(serverGeo,serverExit.x,serverExit.y,serverExit.r);
      imageRegion('archive',archiveGeo);
      ctx.restore();
      // Celestial observatory: miniature view through the archive's central vitrine.
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      clipCircle(twoGeo,lens.x,lens.y,lens.r);
      clipCircle(serverGeo,serverExit.x,serverExit.y,serverExit.r);
      clipCircle(archiveGeo,archivePortal.x,archivePortal.y,archivePortal.r);
      imageRegion('observatory',observatoryGeo);
      ctx.restore();
      // The hidden ending is visible from far away inside the small central planet.
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      clipCircle(twoGeo,lens.x,lens.y,lens.r);
      clipCircle(serverGeo,serverExit.x,serverExit.y,serverExit.r);
      clipCircle(archiveGeo,archivePortal.x,archivePortal.y,archivePortal.r);
      clipCircle(observatoryGeo,skyPortal.x,skyPortal.y,skyPortal.r);
      imageRegion(endKeys[st.ending],endingGeo);
      ctx.restore();
      st.dirty=false;
    }
    function zoomBy(factor){
      st.target=clamp(st.target+Math.log(Math.max(.4,Math.min(2.5,factor))),0,MAX_LOG);
      if(st.target>.35)aria.textContent='Je verkent de wereld door in te zoomen.';
      request();
    }
    function toast(text){
      msg.textContent=text;msg.classList.add('show');
      clearTimeout(st.toastTimer);st.toastTimer=setTimeout(()=>msg.classList.remove('show'),3100);
      aria.textContent=text;
    }
    power.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      // Never select the same ending twice in a row: the button must visibly work.
      st.ending=(st.ending+1+Math.floor(Math.random()*(endKeys.length-1)))%endKeys.length;
      toast('Nieuw verborgen einde gekozen. Zoom verder om het te ontdekken.');
      request();
    });
    canvas.addEventListener('wheel',e=>{
      e.preventDefault();
      const d=e.deltaMode===1?e.deltaY*14:e.deltaMode===2?e.deltaY*360:e.deltaY;
      // Requested reversed wheel direction: scroll UP enters, scroll DOWN returns.
      zoomBy(Math.exp(clamp(-d,-160,160)*.0029));
    },{passive:false});
    const distance=()=>{const a=[...st.pointers.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;};
    canvas.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      canvas.setPointerCapture(e.pointerId);
      st.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      st.lastPinch=distance();canvas.style.cursor='grabbing';
    });
    canvas.addEventListener('pointermove',e=>{
      if(!st.pointers.has(e.pointerId))return;
      const before=st.pointers.get(e.pointerId);
      st.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(st.pointers.size===2){const next=distance();if(st.lastPinch>5&&next>5)zoomBy(Math.pow(next/st.lastPinch,.87));st.lastPinch=next;}
      else if(st.pointers.size===1&&st.log>.08){
        const maxX=st.width*.55,maxY=st.height*.55;
        st.panX=clamp(st.panX+(e.clientX-before.x),-maxX,maxX);
        st.panY=clamp(st.panY+(e.clientY-before.y),-maxY,maxY);
        request();
      }
    });
    const release=e=>{st.pointers.delete(e.pointerId);st.lastPinch=distance();canvas.style.cursor='zoom-in';};
    canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);

    canvas.addEventListener('keydown',e=>{
      if(['+','=','ArrowUp'].includes(e.key)){e.preventDefault();zoomBy(1.22);}
      if(['-','ArrowDown'].includes(e.key)){e.preventDefault();zoomBy(1/1.22);}
      if(e.key==='Home'){e.preventDefault();st.target=0;st.panX=st.panY=0;request();}
      if(e.key==='Escape'){st.panX=st.panY=0;request();}
    });
    const obs=new ResizeObserver(resize);obs.observe(canvas);
    resize();request();
  })();
  </script>
</body>
