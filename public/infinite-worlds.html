<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9ddd8" />
  <title>The Bureau of Impossible Things — Infinite Worlds</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9ddd8}
    body{font-family:Inter,Arial,sans-serif;background:radial-gradient(ellipse at 50% 39%,#f7eee7,#e6d9d0 87%)}
    .world{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:zoom-in;outline:none;user-select:none;-webkit-user-select:none}
    canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #af8b63;outline-offset:-4px}
    .power{position:absolute;display:flex;align-items:center;gap:7px;z-index:5;padding:4px 8px 4px 4px;border:1px solid #a98566a8;border-radius:25px;color:#e9d3b6;background:rgba(28,30,32,.96);font-size:8px;letter-spacing:1px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 3px 13px #0004;transform:translate(-50%,-50%);transition:opacity .16s,background .15s}
    .power:hover,.power:focus-visible{background:#2c3437;outline:1px solid #deba87}
    .power svg{width:19px;height:19px;flex:none}
    .power[hidden]{display:none!important}
    .message{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(90%,480px);border:1px solid #cab39488;border-radius:5px;padding:9px 12px;background:#f9f4edeb;color:#4a4540;font-size:11px;line-height:1.35;letter-spacing:.03em;text-align:center;box-shadow:0 5px 26px #33221123;opacity:0;pointer-events:none;transition:opacity .25s}
    .message.show{opacity:1}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:630px){.power{font-size:7px;letter-spacing:.55px;padding:3px 6px 3px 3px}.power svg{width:17px;height:17px}.message{font-size:10px;bottom:9px}}
  </style>
</head>
<body>
  <main class="world">
    <canvas id="drawing" tabindex="0" role="application" aria-label="The Bureau of Impossible Things. Scroll omhoog om in te zoomen, omlaag om uit te zoomen, of gebruik twee vingers. Sleep om rond te kijken. Door het kleine sleutelgat en de enkele telescooplens zie je de volgende wereld al van veraf; Random kiest alleen een einde."></canvas>
    <button id="random" class="power" type="button" title="Random: kies een willekeurig einde. Je komt er alleen door zelf te zoomen." aria-label="Kies een willekeurig einde; zoom verder om het te ontdekken">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"><path d="M12 2.5v9"/><path d="M6.5 5.6a9 9 0 1 0 11 0"/></svg><span>RANDOM EINDE</span>
    </button>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div id="aria-status" class="sr" aria-live="polite"></div>
  </main>
  <script>
  (()=>{
    'use strict';
    const canvas=document.getElementById('drawing');
    const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
    const power=document.getElementById('random');
    const msg=document.getElementById('message');
    const aria=document.getElementById('aria-status');
    if(!ctx)return;
    const assets={};
    const sources={
      one:'/bureau-world-one.webp',
      door:'/bureau-door-detail.svg',
      two:'/bureau-world-two.webp',
      server:'/bureau-server-corridor.webp',
      puffer:'/bureau-ending-puffer.webp',
      shrimp:'/bureau-ending-shrimp.webp'
    };
    const st={log:0,target:0,panX:0,panY:0,width:0,height:0,dpr:1,frame:0,dirty:true,lastPinch:0,ending:0,toastTimer:0,pointers:new Map()};
    const MAX_LOG=14.2;
    const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
    const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
    const request=()=>{st.dirty=true;if(!st.frame)st.frame=requestAnimationFrame(render);};
    for(const [key,url] of Object.entries(sources)){
      const img=new Image();img.decoding='async';
      img.onload=request; img.onerror=()=>{aria.textContent='Een illustratie kon niet worden geladen.';request();};
      img.src=url; assets[key]=img;
    }
    const ready=key=>assets[key]&&assets[key].complete&&assets[key].naturalWidth>0;
    const resize=()=>{
      const b=canvas.getBoundingClientRect();st.width=b.width;st.height=b.height;
      st.dpr=Math.min(2,window.devicePixelRatio||1);
      const w=Math.max(1,Math.round(st.width*st.dpr)),h=Math.max(1,Math.round(st.height*st.dpr));
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
      request();
    };
    const door={x:459,y:675,w:44,h:58};
    const lens={x:541,y:766,r:33.5};
    const serverExit={x:512,y:820,r:17};
    // Exact registration: this small, ordinary escutcheon uses the SAME path in the SVG and canvas.
    // The glimpse beyond the door therefore has no independent position or rescaling.
    const aperture={x:472,y:680,w:32,h:47};
    const keyholePath=new Path2D('M488 680 C477 680 472 687 472 694 Q472 702 482 708 L478 722 Q488 727 498 722 L494 708 Q504 701 504 694 C504 686 499 680 488 680Z');
    function keyhole(){ctx.clip(keyholePath);}
    // Four small framed monitor displays, to replace only the most visible paintings.
    function paintScreens(){
      const screens=[{x:343,y:667,w:16,h:61},{x:601,y:667,w:16,h:61},{x:379,y:684,w:9,h:40},{x:574,y:684,w:9,h:40}];
      for(const r of screens){
        ctx.save();ctx.fillStyle='#e8ddcf';ctx.fillRect(r.x-2,r.y-2,r.w+4,r.h+4);
        ctx.fillStyle='#967c59';ctx.fillRect(r.x-.7,r.y-.7,r.w+1.4,r.h+1.4);
        ctx.fillStyle='#202e36';ctx.fillRect(r.x+.6,r.y+.6,r.w-1.2,r.h-1.2);
        ctx.strokeStyle='#6f9da4';ctx.lineWidth=.8;ctx.beginPath();
        ctx.moveTo(r.x+2,r.y+r.h*.65);ctx.lineTo(r.x+r.w*.42,r.y+r.h*.48);ctx.lineTo(r.x+r.w*.62,r.y+r.h*.6);ctx.lineTo(r.x+r.w-2,r.y+r.h*.26);ctx.stroke();
        ctx.fillStyle='#b2cfd2';ctx.fillRect(r.x+2,r.y+r.h*.14,r.w*.4,.85);ctx.restore();
      }
    }
    const endKeys=['puffer','shrimp'];
    // Each world has one fixed affine registration with its parent. The single
    // round telescope aperture is inset INSIDE the painted brass rim, not over it.
    // At extreme zoom we paint only the visible image pixels, preventing the
    // enormous off-screen transforms that made the last world disappear on iOS.
    function imageRegion(key,geo){
      if(!ready(key)||geo.sx<=0||geo.sy<=0)return;
      const img=assets[key];
      const left=clamp((-geo.ox-2)/geo.sx,0,img.naturalWidth);
      const top=clamp((-geo.oy-2)/geo.sy,0,img.naturalHeight);
      const right=clamp((st.width-geo.ox+2)/geo.sx,0,img.naturalWidth);
      const bottom=clamp((st.height-geo.oy+2)/geo.sy,0,img.naturalHeight);
      if(right<=left||bottom<=top)return;
      ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
      ctx.drawImage(img,left,top,right-left,bottom-top,
        geo.ox+left*geo.sx,geo.oy+top*geo.sy,
        (right-left)*geo.sx,(bottom-top)*geo.sy);
    }
    function boxCoversView(g,w,h){
      return g.ox<=0&&g.oy<=0&&g.ox+w*g.sx>=st.width&&g.oy+h*g.sy>=st.height;
    }
    function clipRect(g,w,h){
      if(boxCoversView(g,w,h))return;
      ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
      ctx.beginPath();ctx.rect(g.ox,g.oy,w*g.sx,h*g.sy);ctx.clip();
    }
    function clipKeyhole(g){
      // At very deep zoom the camera and viewport are fully inside the tiny
      // top section of the keyhole. Skipping the huge off-screen clip is exact.
      const centerX=g.ox+488*g.sx,centerY=g.oy+700*g.sy;
      const safeX=3.1*g.sx,safeY=6*g.sy;
      if(centerX-safeX<=0&&centerX+safeX>=st.width&&
         centerY-safeY<=0&&centerY+safeY>=st.height)return;
      ctx.setTransform(st.dpr*g.sx,0,0,st.dpr*g.sy,st.dpr*g.ox,st.dpr*g.oy);
      ctx.clip(keyholePath);
    }
    function clipCircle(g,cx,cy,rad){
      const x=g.ox+g.sx*cx,y=g.oy+g.sy*cy;
      const rx=rad*g.sx,ry=rad*g.sy;
      const maxDX=Math.max(Math.abs(x),Math.abs(st.width-x))/rx;
      const maxDY=Math.max(Math.abs(y),Math.abs(st.height-y))/ry;
      if(maxDX*maxDX+maxDY*maxDY<.998)return;
      ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
      ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.clip();
    }
    function render(){
      st.frame=0;
      const {width:vw,height:vh,dpr}=st;if(vw<=0||vh<=0)return;
      const delta=st.target-st.log;
      st.log+=delta*(reduced?1:.19);
      if(Math.abs(delta)<.00015)st.log=st.target;else request();
      const z=Math.exp(st.log);
      const fit=Math.min(vw/960,vh/1370);
      const telescopeDiameter=lens.r*2;
      const serverScale=telescopeDiameter/1024;
      // Exact cumulative coordinates; no image-to-image motion or scale jumps.
      const lensX=door.x+door.w/900*(aperture.x+aperture.w/1086*lens.x);
      const lensY=door.y+door.h/1200*(aperture.y+aperture.h/1448*lens.y);
      const endX=lensX+(serverExit.x-512)*door.w/900*aperture.w/1086*serverScale;
      const endY=lensY+(serverExit.y-768)*door.h/1200*aperture.h/1448*serverScale;
      const approach=smooth(st.log/3.7);
      const deep=smooth((st.log-6.5)/3.3);
      const focusX=480+(lensX-480)*approach+(endX-lensX)*deep;
      const focusY=685+(lensY-685)*approach+(endY-lensY)*deep;
      const base={ox:vw/2+st.panX-focusX*fit*z,
                  oy:vh/2+st.panY-focusY*fit*z,sx:fit*z,sy:fit*z};
      const doorGeo={ox:base.ox+door.x*base.sx,oy:base.oy+door.y*base.sy,
                     sx:base.sx*door.w/900,sy:base.sy*door.h/1200};
      const twoGeo={ox:doorGeo.ox+aperture.x*doorGeo.sx,
                    oy:doorGeo.oy+aperture.y*doorGeo.sy,
                    sx:doorGeo.sx*aperture.w/1086,
                    sy:doorGeo.sy*aperture.h/1448};
      const serverGeo={ox:twoGeo.ox+(lens.x-512*serverScale)*twoGeo.sx,
                       oy:twoGeo.oy+(lens.y-768*serverScale)*twoGeo.sy,
                       sx:twoGeo.sx*serverScale,sy:twoGeo.sy*serverScale};
      const endingScale=36/1086;
      const endingGeo={ox:serverGeo.ox+(serverExit.x-543*endingScale)*serverGeo.sx,
                       oy:serverGeo.oy+(serverExit.y-721*endingScale)*serverGeo.sy,
                       sx:serverGeo.sx*endingScale,sy:serverGeo.sy*endingScale};
      const px=base.ox+480*base.sx;
      const py=base.oy+882*base.sy;
      power.hidden=st.log>.38||!ready('one');
      if(!power.hidden){power.style.left=px+'px';power.style.top=py+'px';}
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle='#e9ddd8';ctx.fillRect(0,0,vw,vh);
      if(!ready('one')){
        ctx.fillStyle='#574b44';ctx.font='13px Arial';ctx.textAlign='center';
        ctx.fillText('De wereld wordt geladen…',vw/2,vh/2);return;
      }
      // World 1: preserve approved artwork exactly until it fills the entrance.
      if(z<80){imageRegion('one',base);
        ctx.save();ctx.setTransform(dpr*base.sx,0,0,dpr*base.sy,dpr*base.ox,dpr*base.oy);
        paintScreens();ctx.restore();}
      // Detailed door blends into the original as its small painted door approaches.
      ctx.save();clipRect(base,960,1370);clipRect(doorGeo,900,1200);
      const detailAlpha=smooth((st.log-1.95)/1.32);
      if(ready('door')&&z<3500){ctx.globalAlpha=detailAlpha;imageRegion('door',doorGeo);}
      ctx.globalAlpha=1;
      ctx.restore();
      // Each subsequent drawing is independently clipped to its physical
      // portal and uses a source crop, so deep zoom never overflows the GPU.
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      imageRegion('two',twoGeo);
      ctx.restore();
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      clipCircle(twoGeo,lens.x,lens.y,lens.r);
      imageRegion('server',serverGeo);
      ctx.restore();
      ctx.save();clipRect(doorGeo,900,1200);clipKeyhole(doorGeo);
      clipCircle(twoGeo,lens.x,lens.y,lens.r);
      clipCircle(serverGeo,serverExit.x,serverExit.y,serverExit.r);
      imageRegion(endKeys[st.ending],endingGeo);
      ctx.restore();
      st.dirty=false;
    }
    function zoomBy(factor){
      st.target=clamp(st.target+Math.log(Math.max(.4,Math.min(2.5,factor))),0,MAX_LOG);
      if(st.target>.35)aria.textContent='Je verkent de wereld door in te zoomen.';
      request();
    }
    function toast(text){
      msg.textContent=text;msg.classList.add('show');
      clearTimeout(st.toastTimer);st.toastTimer=setTimeout(()=>msg.classList.remove('show'),3100);
      aria.textContent=text;
    }
    power.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      st.ending=Math.floor(Math.random()*endKeys.length);
      toast('Willekeurig einde gekozen. Blijf zelf zoomen om het te ontdekken.');
      request();
    });
    canvas.addEventListener('wheel',e=>{
      e.preventDefault();
      const d=e.deltaMode===1?e.deltaY*14:e.deltaMode===2?e.deltaY*360:e.deltaY;
      // Requested reversed wheel direction: scroll UP enters, scroll DOWN returns.
      zoomBy(Math.exp(clamp(-d,-200,200)*.00335));
    },{passive:false});
    const distance=()=>{const a=[...st.pointers.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;};
    canvas.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      canvas.setPointerCapture(e.pointerId);
      st.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      st.lastPinch=distance();canvas.style.cursor='grabbing';
    });
    canvas.addEventListener('pointermove',e=>{
      if(!st.pointers.has(e.pointerId))return;
      const before=st.pointers.get(e.pointerId);
      st.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(st.pointers.size===2){const next=distance();if(st.lastPinch>5&&next>5)zoomBy(next/st.lastPinch);st.lastPinch=next;}
      else if(st.pointers.size===1&&st.log>.08){
        const maxX=st.width*.55,maxY=st.height*.55;
        st.panX=clamp(st.panX+(e.clientX-before.x),-maxX,maxX);
        st.panY=clamp(st.panY+(e.clientY-before.y),-maxY,maxY);
        request();
      }
    });
    const release=e=>{st.pointers.delete(e.pointerId);st.lastPinch=distance();canvas.style.cursor='zoom-in';};
    canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);

    canvas.addEventListener('keydown',e=>{
      if(['+','=','ArrowUp'].includes(e.key)){e.preventDefault();zoomBy(1.22);}
      if(['-','ArrowDown'].includes(e.key)){e.preventDefault();zoomBy(1/1.22);}
      if(e.key==='Home'){e.preventDefault();st.target=0;st.panX=st.panY=0;request();}
      if(e.key==='Escape'){st.panX=st.panY=0;request();}
    });
    const obs=new ResizeObserver(resize);obs.observe(canvas);
    resize();request();
  })();
  </script>
</body>
</html>
