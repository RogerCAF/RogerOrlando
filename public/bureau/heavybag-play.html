<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Heavy Bag — Road to Champion | The Bureau</title>
  <link rel="stylesheet" href="/bureau/heavybag-idle.css?v=20261120-idle1">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0c1116;color:#f4e9dc}
    body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    #content{width:100%;max-width:1200px;margin:0 auto;padding:clamp(12px,2.5vw,28px)}
    .modal{width:100%;min-height:0;margin:0;padding:0}
    button{touch-action:manipulation}
  </style>
</head>
<body>
  <main id="content" aria-label="Heavy Bag — Road to Champion idle game"></main>
  <script>
    // Standalone lightweight host; the new idle campaign owns its save data.
    // All artwork and hotspot coordinates on the homepage remain untouched.
    let active = 'bag';
    let hbEarn = function(){};
    let hbAdvance = function(){return false};
    let hbTickTimer = null;
    let hb = {total:0,clicks:0,levels:{}};
    const hbSave = function(){};
    const unlock = function(){};
    const mark = '';
    function modal(html){document.getElementById('content').innerHTML=html}
    function beep(freq,duration){
      // Keep the game playable even on browsers that disable audio.
      try{
        const Audio = window.AudioContext || window.webkitAudioContext;
        if(!Audio)return;
        window.__heavybagAudio = window.__heavybagAudio || new Audio();
        const ctx=window.__heavybagAudio;
        if(ctx.state==='suspended')ctx.resume().catch(()=>{});
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.type='sine';osc.frequency.value=freq;
        gain.gain.setValueAtTime(.025,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+Math.max(.02,duration));
        osc.connect(gain).connect(ctx.destination);
        osc.start();osc.stop(ctx.currentTime+Math.max(.02,duration));
      }catch{}
    }
  </script>
  <script src="/bureau/heavybag-idle.js?v=20261120-idle1"></script>
  <script>if(typeof window.openHeavyBag==='function')window.openHeavyBag();</script>
</body>
</html>
