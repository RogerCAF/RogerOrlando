<!-- One unified, physically seated desktop peripheral pair, following the rear/front desk edge at ~ -2deg. -->
<defs>
 <linearGradient id="keySurface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#474047"/><stop offset=".25" stop-color="#292b35"/><stop offset="1" stop-color="#171a21"/></linearGradient>
 <linearGradient id="keyFront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#302d32"/><stop offset="1" stop-color="#111820"/></linearGradient>
 <linearGradient id="mouseBody" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#4a4142"/><stop offset=".5" stop-color="#242831"/><stop offset="1" stop-color="#161a23"/></linearGradient>
 <filter id="contactShadow" x="-20%" y="-75%" width="145%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
