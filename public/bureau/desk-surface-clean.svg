<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
  <!-- A single clean tabletop joining the ORIGINAL monitor, keyboard, mouse and PC.
       No chair, cabinets, drawers, separate floating pieces or fake floor. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#45332b"/>
      <stop offset=".26" stop-color="#80543c"/>
      <stop offset=".55" stop-color="#6c4636"/>
      <stop offset=".80" stop-color="#533b31"/>
      <stop offset="1" stop-color="#332931"/>
    </linearGradient>
    <linearGradient id="front" x1="0" x2=".28" y1="0" y2="1">
      <stop stop-color="#453327"/>
      <stop offset=".42" stop-color="#352a28"/>
      <stop offset="1" stop-color="#1b1c23"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1">
      <stop stop-color="#ac714a"/>
      <stop offset=".26" stop-color="#d59b62"/>
      <stop offset=".6" stop-color="#bd8051"/>
      <stop offset="1" stop-color="#936047"/>
    </linearGradient>
    <filter id="depth" x="-12%" y="-30%" width="124%" height="170%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <!-- Soft contact shadow belongs to the tabletop, not a separate floating stroke. -->
  <path d="M276 707 Q805 677 1480 687 L1493 726 Q817 796 302 782 Z"
        fill="#060a10" opacity=".22" filter="url(#depth)"/>
  <!-- One restrained perspective plane, placed behind the real keyboard and mouse. -->
  <path d="M284 600 Q854 589 1401 569 Q1419 568 1427 584
           L1472 674 Q1477 685 1462 690 L338 745
           Q330 746 322 741 L260 693 Q252 685 259 672 Z"
        fill="url(#wood)" stroke="#11141a" stroke-width="5.4"
        stroke-linejoin="round"/>
  <!-- Subtle integrated top edge. No loose lines outside the silhouette. -->
  <path d="M293 611 Q850 602 1395 580" fill="none"
        stroke="#ae825d" stroke-width="2.1" opacity=".62" stroke-linecap="round"/>
  <path d="M266 686 L330 737 Q335 741 341 741 L1463 681"
        fill="none" stroke="url(#rim)" stroke-width="4.3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Compact front fascia. The bottom ends cleanly: no legs or drawers. -->
  <path d="M260 689 L332 741 L1464 685 L1464 708
           Q1463 715 1452 718 L345 770
           Q330 772 321 764 L257 716 Z"
        fill="url(#front)" stroke="#11161b" stroke-width="5.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M328 754 Q833 730 1456 700"
        fill="none" stroke="#b77e51" stroke-width="1.5"
        opacity=".32" stroke-linecap="round"/>
  <!-- Fine warm highlight under the top, inside the desk shape. -->
  <path d="M340 739 Q880 710 1460 681"
        fill="none" stroke="#d3a67c" stroke-width=".9" opacity=".32"/>
  <path d="M265 699 L330 754" stroke="#7c573f" stroke-width="1.2" opacity=".4"/>
</svg>