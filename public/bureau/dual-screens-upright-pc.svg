<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#49434a"/><stop offset=".4" stop-color="#1d2029"/><stop offset=".8" stop-color="#29252a"/><stop offset="1" stop-color="#0e1118"/>
 </linearGradient>
 <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#46362f"/><stop offset=".28" stop-color="#242027"/><stop offset=".72" stop-color="#11151d"/><stop offset="1" stop-color="#342a2c"/>
 </linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#292528"/><stop offset=".28" stop-color="#10141b"/><stop offset=".72" stop-color="#1b171a"/><stop offset="1" stop-color="#312222"/>
 </linearGradient>
 <radialGradient id="fan"><stop stop-color="#ebbd8d"/><stop offset=".15" stop-color="#a96634"/><stop offset=".36" stop-color="#302429"/><stop offset=".71" stop-color="#cb793c"/><stop offset=".86" stop-color="#71452e"/><stop offset="1" stop-color="#2a2227"/></radialGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131b"/><stop offset=".5" stop-color="#070b12"/><stop offset="1" stop-color="#171117"/></linearGradient>
 <linearGradient id="rim"><stop stop-color="#d0a178"/><stop offset=".48" stop-color="#5a4641"/><stop offset="1" stop-color="#ad7b51"/></linearGradient>
 <clipPath id="rubikclip"><rect x="782" y="91" width="109" height="85"/></clipPath>
</defs>

<!-- Brushed-metal dual arm. Clamp and articulated joints are below the
