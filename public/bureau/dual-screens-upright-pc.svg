<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#49434a"/><stop offset=".4" stop-color="#1d2029"/><stop offset=".8" stop-color="#29252a"/><stop offset="1" stop-color="#0e1118"/>
 </linearGradient>
 <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#46362f"/><stop offset=".28" stop-color="#242027"/><stop offset=".72" stop-color="#11151d"/><stop offset="1" stop-color="#342a2c"/>
 </linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#292528"/><stop offset=".28" stop-color="#10141b"/><stop offset=".72" stop-color="#1b171a"/><stop offset="1" stop-color="#312222"/>
 </linearGradient>
 <radialGradient id="fan"><stop stop-color="#ebbd8d"/><stop offset=".15" stop-color="#a96634"/><stop offset=".36" stop-color="#302429"/><stop offset=".71" stop-color="#cb793c"/><stop offset=".86" stop-color="#71452e"/><stop offset="1" stop-color="#2a2227"/></radialGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131b"/><stop offset=".5" stop-color="#070b12"/><stop offset="1" stop-color="#171117"/></linearGradient>
 <linearGradient id="rim"><stop stop-color="#d0a178"/><stop offset=".48" stop-color="#5a4641"/><stop offset="1" stop-color="#ad7b51"/></linearGradient>
 <clipPath id="rubikclip"><rect x="782" y="91" width="109" height="85"/></clipPath>
</defs>

<!-- Brushed-metal dual arm. Clamp and articulated joints are below the
     original landscape monitor and the new portrait monitor. -->
<g stroke-linecap="round" stroke-linejoin="round">
  <path d="M909 582 L965 580 L967 590 L904 593 Z" fill="#171920" stroke="#b18b66" stroke-width="1.95"/>
  <path d="M931 579 L936 553 L954 551 L950 581 Z" fill="url(#metal)" stroke="#100f16" stroke-width="4.55"/>
  <path d="M932 551 L942 547 L955 552" fill="none" stroke="#d1aa7f" stroke-width="1.46"/>
  <path d="M952 569 L1056 556 L1143 519" fill="none" stroke="#171922" stroke-width="12.06"/>
  <path d="M952 567 L1056 554 L1143 517" fill="none" stroke="#a47d58" stroke-width="1.95" opacity=".75"/>
  <circle cx="1055" cy="555" r="11" fill="#1a1b23" stroke="#b79369" stroke-width="1.95"/>
  <circle cx="1143" cy="519" r="10" fill="#1a1b23" stroke="#b79369" stroke-width="1.95"/>
  <path d="M1150 519 L1157 532 L1200 541" fill="none" stroke="#29252b" stroke-width="6.7"/>
  <path d="M1153 522 L1200 539" fill="none" stroke="#c19461" stroke-opacity="0.56" stroke-width="1.46"/>
  <path d="M914 575 L891 555" fill="none" stroke="#1a1922" stroke-width="8.04"/>
  <path d="M914 575 L891 555" fill="none" stroke="#bc946c" stroke-width="1.46"/>
  <circle cx="892" cy="554" r="7" fill="#1b1c22" stroke="#bb946b" stroke-width="1.46"/>
</g>

<!-- A SECOND, VERTICAL MONITOR: clean graphite, matching amber trim.
     It intentionally sits at the right edge of the original main monitor. -->
<g>
 <rect x="1103" y="280" width="152" height="268" rx="10" fill="#0a0c13" stroke="#11141b" stroke-width="5.36"/>
 <rect x="1104" y="281" width="150" height="266" rx="9" fill="none" stroke="#c19468" stroke-width="1.95" opacity=".70"/>
 <rect x="1114" y="292" width="130" height="243" rx="3" fill="url(#screen)" stroke="#55515a" stroke-width="1.09"/>
 <path d="M1120 322 Q1148 316 1163 330 T1242 326 M1118 499 Q1160 481 1180 495 T1243 486"
   fill="none" stroke="#aa5639" stroke-opacity="0.24" stroke-width="1.53"/>
 <path d="M1123 305 L1233 305" stroke="#9b6a4c" stroke-opacity="0.44"/>
 <text x="1178" y="342" text-anchor="middle" fill="#e8d9c9" font-size="13" font-family="Georgia,serif" letter-spacing="2.2">ARCHIVE</text>
 <text x="1178" y="363" text-anchor="middle" fill="#a99b98" font-size="7.2" font-family="Arial,sans-serif" letter-spacing="2.2">SECOND SCREEN</text>
 <path d="M1134 379 H1222" stroke="#524a4b" stroke-width="1.09"/>
 <g fill="#29252a" stroke="#8d6650" stroke-opacity="0.52" stroke-width="0.92">
  <rect x="1131" y="391" width="94" height="25" rx="3"/>
  <rect x="1131" y="424" width="94" height="25" rx="3"/>
  <rect x="1131" y="457" width="94" height="25" rx="3"/>
 </g>
 <g font-size="7" font-family="Arial,sans-serif" fill="#e1b68b" letter-spacing="1.2">
  <text x="1143" y="407">PROJECTS</text>
  <text x="1143" y="440">PLAYGROUND</text>
  <text x="1143" y="473">NOTES</text>
 </g>
 <g fill="#b78054"><circle cx="1214" cy="404" r="2.7"/><circle cx="1214" cy="437" r="2.7"/><circle cx="1214" cy="470" r="2.7"/></g>
 <path d="M1123 517 L1237 517" stroke="#98724f" stroke-width="0.92" opacity=".6"/>
 <circle cx="1178" cy="541" r="2.2" fill="#d59b68"/>
</g>

<!-- Truly FRONT-FACING PC tower. Single vertical front plane, absolutely no
     side-wall, 3/4 projection, skewed top or trapezoid. Its original screen
     footprint and interactive hotspot stay unchanged. -->
<g id="pc-front-elevation" stroke-linejoin="round" stroke-linecap="round">
  <!-- A taller-than-wide chassis, square-on from the front. -->
  <rect x="1274" y="296" width="221" height="280" rx="7" fill="#10121a"
        stroke="#0a0d13" stroke-width="4.55"/>
  <rect x="1276" y="298" width="217" height="276" rx="6" fill="url(#tower)"
        stroke="#bc8d61" stroke-width="1.83" />
  <!-- One flush front window; both the components and fans sit BEHIND it. -->
  <rect x="1286" y="309" width="195" height="251" rx="3"
        fill="url(#glass)" stroke="#53413c" stroke-width="1.95"/>
  <rect x="1291" y="314" width="185" height="240" rx="2"
        fill="#0c1016" fill-opacity=".67" stroke="#997052"
        stroke-opacity="0.44" stroke-width="1.09"/>
  <!-- Delicate printed motherboard traces, strictly horizontal/vertical. -->
  <g stroke="#8a5e42" stroke-width="1.34" fill="none" opacity=".63">
    <path d="M1303 334 H1343 V363 H1353 M1304 348 H1328 V377 H1353
             M1303 523 H1345 V504 H1355 M1312 539 H1349 V513
             M1303 409 H1351 M1303 423 H1346 M1303 468 H1342
             M1304 483 H1349"/>
  </g>
  <rect x="1300" y="373" width="54" height="102" rx="3"
        fill="#15171b" stroke="#99704e" stroke-width="1.43"/>
  <path d="M1307 381 H1347 M1307 466 H1347 M1310 393 V451
           M1344 391 V457" stroke="#bf8457" stroke-width="1.34" opacity=".62"/>
  <circle cx="1327" cy="421" r="17" fill="#1a1a20"
          stroke="#ca925c" stroke-width="1.39"/>
  <path d="M1316 424 L1321 417 L1327 424 L1333 417 L1338 424"
        fill="none" stroke="#d2a475" stroke-width="1.18"/>
  <rect x="1305" y="491" width="49" height="11" rx="1"
        fill="#2b2527" stroke="#ac774e" stroke-width="1.09"/>

  <!-- Front fans are evenly spaced, all circles in ONE vertical plane. -->
  <g>
    <circle cx="1411" cy="352" r="30" fill="#17141b" stroke="#5b4035" stroke-width="1.75"/>
    <circle cx="1411" cy="352" r="25" fill="url(#fan)" stroke="#e1a16b" stroke-width="1.46"/>
    <circle cx="1411" cy="352" r="12" fill="#25191e" stroke="#d8a777" stroke-width="1.31"/>
    <circle cx="1411" cy="435" r="30" fill="#17141b" stroke="#5b4035" stroke-width="1.75"/>
    <circle cx="1411" cy="435" r="25" fill="url(#fan)" stroke="#e1a16b" stroke-width="1.46"/>
    <circle cx="1411" cy="435" r="12" fill="#25191e" stroke="#d8a777" stroke-width="1.31"/>
    <circle cx="1411" cy="518" r="30" fill="#17141b" stroke="#5b4035" stroke-width="1.75"/>
    <circle cx="1411" cy="518" r="25" fill="url(#fan)" stroke="#e1a16b" stroke-width="1.46"/>
    <circle cx="1411" cy="518" r="12" fill="#25191e" stroke="#d8a777" stroke-width="1.31"/>
  </g>
  <!-- Subtle glass detail and straight bezel: no 3D corner anywhere. -->
  <path d="M1289 317 H1478 M1289 550 H1478"
        stroke="#e0ab78" stroke-width="1.26" opacity=".47"/>
  <path d="M1294 320 V543" stroke="#b99a7c" stroke-width="0.92" opacity=".25"/>
  <path d="M1471 321 V543" stroke="#d6a16c" stroke-width="0.92" opacity=".39"/>
  <path d="M1283 570 H1486" stroke="#f0b77c" stroke-width="1.26" opacity=".52"/>
  <circle cx="1284" cy="308" r="2" fill="#b58a5e"/>
  <circle cx="1486" cy="308" r="2" fill="#b58a5e"/>
  <circle cx="1284" cy="566" r="2" fill="#b58a5e"/>
  <circle cx="1486" cy="566" r="2" fill="#b58a5e"/>
  <path d="M1291 576 V580 H1314 V576 M1454 576 V580 H1478 V576"
        fill="none" stroke="#74523e" stroke-width="1.83"/>
</g>

<!-- Precision vectors on top of the SAME Rubik's Cube, no size or position change. -->
<g clip-path="url(#rubikclip)" stroke-linejoin="round" stroke-linecap="round">
 <path d="M785 113 L829 94 L883 105 L883 185 L843 205 L785 186 Z" fill="none" stroke="#0d111a" stroke-width="2.8"/>
 <path d="M785 113 L843 128 L883 105 M843 128 L843 204" fill="none" stroke="#f3c594" stroke-width="1.46"/>
 <path d="M805 118 L805 189 M824 125 L824 197 M785 140 L843 151 M785 161 L843 174" fill="none" stroke="#12151c" stroke-width="1.75"/>
 <path d="M856 122 L856 201 M869 113 L869 194 M844 152 L882 139 M844 175 L883 163" fill="none" stroke="#15131a" stroke-width="1.46"/>
 <path d="M794 106 L850 118 M803 103 L859 115 M812 99 L870 112" fill="none" stroke="#e2ae6e" stroke-width="1.13" opacity=".70"/>
</g>
</svg>