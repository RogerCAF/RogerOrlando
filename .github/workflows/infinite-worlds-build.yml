name: Infinite Worlds build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/infinite-worlds-storybook-v2]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
